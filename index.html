<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LiteEditor">
    <title>LiteEditor</title>
    <link rel="manifest" href="./manifest.webmanifest?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=1">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=1">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=1">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=1">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html, .container { height: 100%; background: #ffffff; color: #000000; overflow: hidden; display: flex; flex-direction: column; }
        header { background: #ffffff; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #000000; flex-wrap: wrap; gap: 8px; }
        .tabs { display: flex; flex-wrap: wrap; background: #ffffff; border: 2px solid #000000; border-radius: 4px; padding: 2px; gap: 2px; }
        .toggle { display: flex; background: #ffffff; border: 2px solid #000000; border-radius: 4px; padding: 2px; }
        button { background: transparent; color: #000000; border: none; padding: 6px 11px; font-size: 0.78rem; cursor: pointer; border-radius: 2px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; user-select: none; }
        button.active { background: #000000; color: #ffffff; }
        .actions { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
        .actions button { background: #ffffff; color: #000000; border: 2px solid #000000; }
        .actions button:hover { background: #000000; color: #ffffff; }
        .actions .danger { background: #000000; color: #ffffff; }
        .workspace { flex: 1; position: relative; background: #ffffff; width: 100%; min-height: 0; }
        textarea, .preview-pane { width: 100%; height: 100%; position: absolute; top: 0; left: 0; border: none; padding: 20px; display: none; outline: none; }
        textarea { background: #ffffff; color: #000000; font-family: 'Consolas', 'Courier New', monospace; font-size: 1rem; resize: none; line-height: 1.5; }
        .preview-pane { background: #ffffff; color: #000000; overflow-y: auto; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; display: none; }
        .static-render { display: none; line-height: 1.6; }
        .static-render h1, .static-render h2 { border-bottom: 2px solid #000000; padding-bottom: 4px; margin: 15px 0 10px; font-weight: 800; }
        .static-render pre { background: #f0f0f0; padding: 12px; border: 1px solid #000000; border-radius: 4px; overflow: auto; font-family: monospace; }
        .static-render table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .static-render th, .static-render td { border: 1px solid #000000; padding: 10px; font-size: 0.9rem; }
        .static-render th { background: #f0f0f0; font-weight: 700; text-align: left; }
        .static-render tr:nth-child(even) { background: #f9f9f9; }
        footer { background: #ffffff; color: #000000; text-align: center; padding: 7px; font-size: 0.7rem; font-weight: 600; border-top: 2px solid #000000; letter-spacing: 0.2px; user-select: none; }
        #workspace-input, #file-input { display: none; }
        @media (max-width: 720px) {
            header { align-items: stretch; }
            .tabs { width: 100%; }
            .tabs button { flex: 1 1 auto; }
            .top-tools { width: 100%; min-width: 0 !important; }
            .toggle { width: 100%; }
            .toggle button { flex: 1; }
            .actions { width: 100%; justify-content: stretch; }
            .actions button { flex: 1 1 30%; min-height: 40px; }
            textarea, .preview-pane { padding: 14px; }
            footer { font-size: 0.62rem; padding: 6px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="tabs" id="lang-tabs">
                <button class="active" onclick="setLang('html')">HTML</button>
                <button onclick="setLang('css')">CSS</button>
                <button onclick="setLang('js')">JS</button>
                <button onclick="setLang('md')">Markdown</button>
                <button onclick="setLang('txt')">Text</button>
                <button onclick="setLang('csv')">CSV</button>
            </div>

            <div class="top-tools" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:space-between; flex:1; min-width:280px;">
                <div class="toggle">
                    <button class="active" id="tab-edit" onclick="setView('edit')">Editor</button>
                    <button id="tab-prev" onclick="setView('preview')">Preview</button>
                </div>

                <div class="actions">
                    <button onclick="document.getElementById('file-input').click()">Open File</button>
                    <button onclick="document.getElementById('workspace-input').click()">Load Workspace</button>
                    <button onclick="saveWorkspace()">Save Workspace</button>
                    <button onclick="exportCurrent()">Export Current</button>
                    <button onclick="exportWebPage()">Export Web Page</button>
                    <button class="danger" onclick="wipeWorkspace()">Wipe</button>
                </div>
            </div>
        </header>

        <div class="workspace">
            <textarea id="editor" placeholder="Paste or type your content here..."></textarea>
            <div class="preview-pane" id="preview-container">
                <iframe id="win-web"></iframe>
                <div id="win-static" class="static-render"></div>
            </div>
        </div>

        <footer>
            STATELESS EDITOR · Workspace JSON is a backup. Export Current creates a real file. Export Web Page bundles HTML + CSS + JS.
        </footer>
    </div>

    <input type="file" id="workspace-input" accept="application/json,.json" onchange="loadWorkspace(event)">
    <input type="file" id="file-input" accept=".html,.htm,.css,.js,.mjs,.md,.markdown,.txt,.csv,text/*" onchange="openFile(event)">

    <script>
        let lang = 'html', view = 'edit';
        let data = { html:'', css:'', js:'', md:'', txt:'', csv:'' };
        const box = document.getElementById('editor');

        const fileTypes = {
            html: { ext: 'html', mime: 'text/html', name: 'document.html' },
            css:  { ext: 'css',  mime: 'text/css', name: 'styles.css' },
            js:   { ext: 'js',   mime: 'text/javascript', name: 'script.js' },
            md:   { ext: 'md',   mime: 'text/markdown', name: 'document.md' },
            txt:  { ext: 'txt',  mime: 'text/plain', name: 'notes.txt' },
            csv:  { ext: 'csv',  mime: 'text/csv', name: 'data.csv' }
        };

        function setLang(target) {
            data[lang] = box.value;
            lang = target;
            document.querySelectorAll('#lang-tabs button').forEach(b => {
                const t = b.innerText.toLowerCase();
                const active = t === target || (target === 'md' && t === 'markdown') || (target === 'txt' && t === 'text');
                b.classList.toggle('active', active);
            });
            box.value = data[lang] || '';
            if (view === 'preview') compile();
        }

        function setView(target) {
            view = target;
            data[lang] = box.value;
            document.getElementById('tab-edit').classList.toggle('active', target === 'edit');
            document.getElementById('tab-prev').classList.toggle('active', target === 'preview');
            if (target === 'edit') {
                box.style.display = 'block';
                document.getElementById('preview-container').style.display = 'none';
            } else {
                box.style.display = 'none';
                document.getElementById('preview-container').style.display = 'block';
                compile();
            }
        }

        function compile() {
            data[lang] = box.value;
            const webWin = document.getElementById('win-web');
            const statWin = document.getElementById('win-static');
            if (lang === 'html' || lang === 'css' || lang === 'js') {
                webWin.style.display = 'block';
                statWin.style.display = 'none';
                const doc = webWin.contentWindow.document;
                doc.open();
                const safeJs = (data.js || '').replace(/<\/script/gi, '<\\/script');
                doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${data.css || ''}</style></head><body>${data.html || ''}<script>try{${safeJs}}catch(e){document.body.innerHTML+='<div style="color:#c00;border:2px solid #000;padding:12px;margin:20px;font-family:monospace"><strong>[JS Error]</strong><br>'+e.message+'</div>';}<\/script></body></html>`);
                doc.close();
            } else {
                webWin.style.display = 'none';
                statWin.style.display = 'block';
                if (lang === 'md') statWin.innerHTML = marked.parse(data.md || '<em>Empty.</em>');
                if (lang === 'txt') statWin.innerHTML = `<pre style="white-space:pre-wrap;">${escapeHtml(data.txt) || 'Empty.'}</pre>`;
                if (lang === 'csv') {
                    const lines = (data.csv || '').trim().split('\n').filter(l => l.trim());
                    if (!lines.length) { statWin.innerHTML = '<em>Empty.</em>'; return; }
                    statWin.innerHTML = '<table>' + lines.map((line, i) => `<tr>${parseCsvLine(line).map(cell => i === 0 ? `<th>${escapeHtml(cell)}</th>` : `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('') + '</table>';
                }
            }
        }

        function parseCsvLine(line) {
            const out = [];
            let cur = '', quoted = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (quoted && line[i + 1] === '"') { cur += '"'; i++; }
                    else quoted = !quoted;
                } else if (ch === ',' && !quoted) {
                    out.push(cur.trim()); cur = '';
                } else cur += ch;
            }
            out.push(cur.trim());
            return out;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function downloadBlob(content, filename, mime) {
            const blob = new Blob([content], { type: `${mime};charset=utf-8` });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function openFile(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            const ext = (file.name.split('.').pop() || '').toLowerCase();
            const target = ext === 'htm' ? 'html' : ext === 'mjs' ? 'js' : ext === 'markdown' ? 'md' : ext;
            if (!fileTypes[target]) { alert('Unsupported file type.'); return; }
            const reader = new FileReader();
            reader.onload = e => {
                data[lang] = box.value;
                data[target] = e.target.result;
                setLang(target);
                setView('edit');
            };
            reader.readAsText(file);
        }

        function saveWorkspace() {
            data[lang] = box.value;
            downloadBlob(JSON.stringify(data, null, 2), `liteditor_workspace_${Date.now()}.json`, 'application/json');
        }

        function loadWorkspace(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const incoming = JSON.parse(e.target.result);
                    data = { html:'', css:'', js:'', md:'', txt:'', csv:'', ...incoming };
                    box.value = data[lang] || '';
                    if (view === 'preview') compile();
                } catch (_) {
                    alert('Invalid workspace file.');
                }
            };
            reader.readAsText(file);
        }

        function exportCurrent() {
            data[lang] = box.value;
            const type = fileTypes[lang];
            downloadBlob(data[lang] || '', type.name, type.mime);
        }

        function exportWebPage() {
            data[lang] = box.value;
            const safeJs = (data.js || '').replace(/<\/script/gi, '<\\/script');
            const page = `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>LiteEditor Export</title>\n<style>\n${data.css || ''}\n</style>\n</head>\n<body>\n${data.html || ''}\n<script>\n${safeJs}\n<\/script>\n</body>\n</html>`;
            downloadBlob(page, 'webpage.html', 'text/html');
        }

        function wipeWorkspace() {
            if (!confirm('Clear all editor tabs?')) return;
            data = { html:'', css:'', js:'', md:'', txt:'', csv:'' };
            setLang('html');
            box.value = '';
            setView('edit');
        }

        box.addEventListener('input', () => { data[lang] = box.value; });
        window.addEventListener('load', () => { box.value = data.html; box.style.display = 'block'; });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
        }
    </script>
</body>
</html>
