<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitEditor</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
        if (typeof marked === 'undefined') {
            document.write('<script src="marked.min.js"><\/script>');
            console.log("LitEditor Engine: Offline state detected. Successfully swapped to side-by-side library.");
        } else {
            console.log("LitEditor Engine: Connected. Running web library asset smoothly.");
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html, .container { height: 100%; background: #ffffff; color: #000000; overflow: hidden; display: flex; flex-direction: column; }
        
        /* High-Contrast Stark Header */
        header { background: #ffffff; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #000000; flex-wrap: wrap; gap: 12px; }
        .tabs, .toggle { display: flex; background: #ffffff; border: 2px solid #000000; border-radius: 4px; padding: 2px; }
        
        /* Stark Black Buttons */
        button { background: transparent; color: #000000; border: none; padding: 6px 14px; font-size: 0.85rem; cursor: pointer; border-radius: 2px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; user-select: none; }
        button.active { background: #000000; color: #ffffff; }
        .btn-zone button { background: #ffffff; color: #000000; border: 2px solid #000000; margin-left: 4px; padding: 6px 12px; transition: all 0.15s; }
        .btn-zone button:hover { background: #000000; color: #ffffff; }
        
        /* Workspace Setup */
        .workspace { flex: 1; position: relative; background: #ffffff; width: 100%; }
        textarea, .preview-pane { width: 100%; height: 100%; position: absolute; top: 0; left: 0; border: none; padding: 20px; display: none; outline: none; }
        
        /* White Editor Sheet */
        textarea { background: #ffffff; color: #000000; font-family: 'Consolas', 'Courier New', monospace; font-size: 1rem; resize: none; line-height: 1.5; }
        
        /* Preview Output Rendering Containers */
        .preview-pane { background: #ffffff; color: #000000; overflow-y: auto; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; display: none; }
        .static-render { display: none; line-height: 1.6; }
        
        /* Static Content Formatting (Markdown/CSV Tables) */
        .static-render h1, .static-render h2 { border-bottom: 2px solid #000000; padding-bottom: 4px; margin: 15px 0 10px 0; font-weight: 800; }
        .static-render pre { background: #f0f0f0; padding: 12px; border: 1px solid #000000; border-radius: 4px; overflow: auto; font-family: monospace; }
        .static-render table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .static-render th, .static-render td { border: 1px solid #000000; padding: 10px; font-size: 0.9rem; }
        .static-render th { background: #f0f0f0; font-weight: 700; text-align: left; }
        .static-render tr:nth-child(even) { background: #f9f9f9; }

        /* Stark Disclaimer Bar */
        footer { background: #ffffff; color: #000000; text-align: center; padding: 8px; font-size: 0.75rem; font-weight: 600; border-top: 2px solid #000000; letter-spacing: 0.3px; user-select: none; }
        #file-input { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="tabs" id="lang-tabs">
                <button class="active" onclick="setLang('html')">HTML</button>
                <button onclick="setLang('css')">CSS</button>
                <button onclick="setLang('js')">JS</button>
                <button onclick="setLang('md')">Markdown</button>
                <button onclick="setLang('txt')">Text</button>
                <button onclick="setLang('csv')">CSV</button>
            </div>
            
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <div class="toggle">
                    <button class="active" id="tab-edit" onclick="setView('edit')">Editor Tab</button>
                    <button id="tab-prev" onclick="setView('preview')">View Tab</button>
                </div>
                
                <div class="btn-zone">
                    <button onclick="document.getElementById('file-input').click()">Import</button>
                    <button onclick="exportWorkspace()">Export</button>
                    <button onclick="wipeWorkspace()" style="background:#000000; color:#ffffff;">Wipe</button>
                </div>
            </div>
        </header>

        <div class="workspace">
            <textarea id="editor" placeholder="Paste or type your content here..."></textarea>
            
            <div class="preview-pane" id="preview-container">
                <iframe id="win-web"></iframe>
                <div id="win-static" class="static-render"></div>
            </div>
        </div>

        <footer>
            DISCLAIMER: This is a lightweight, client-side browser editor. All processing runs locally. Paste errors are isolated safely and will not affect app workspace stability.
        </footer>
    </div>
    
    <input type="file" id="file-input" accept=".json" onchange="importWorkspace(event)">

    <script>
        let lang = 'html', view = 'edit';
        let data = JSON.parse(localStorage.getItem('stark_ws')) || { html:'', css:'', js:'', md:'', txt:'', csv:'' };
        const box = document.getElementById('editor');

        // Handles swapping internal code memory drawers cleanly with matching text strings
        function setLang(target) {
            data[lang] = box.value;
            lang = target;
            
            document.querySelectorAll('#lang-tabs button').forEach(b => {
                const normalizedBtnText = b.innerText.toLowerCase();
                // Verifies true match parameters regardless of casing styles or shorthand mappings
                const isCurrentActive = normalizedBtnText === target || 
                                       (target === 'md' && normalizedBtnText === 'markdown') ||
                                       (target === 'txt' && normalizedBtnText === 'text');
                                       
                b.classList.toggle('active', isCurrentActive);
            });
            
            box.value = data[lang] || '';
            if (view === 'preview') compile();
        }

        // Handles switching between the primary two tabs: Editor vs View
        function setView(target) {
            view = target;
            data[lang] = box.value;
            document.getElementById('tab-edit').classList.toggle('active', target === 'edit');
            document.getElementById('tab-prev').classList.toggle('active', target === 'preview');
            
            if (target === 'edit') {
                box.style.display = 'block';
                document.getElementById('preview-container').style.display = 'none';
            } else {
                box.style.display = 'none';
                document.getElementById('preview-container').style.display = 'block';
                compile();
            }
        }

        // The Central Safety Rendering Loop Engine
        function compile() {
            localStorage.setItem('stark_ws', JSON.stringify(data));
            const webWin = document.getElementById('win-web'), statWin = document.getElementById('win-static');
            
            // 1. ISOLATED WEB COMPILATION SUITE (HTML/CSS/JS)
            if (lang === 'html' || lang === 'css' || lang === 'js') {
                webWin.style.display = 'block'; statWin.style.display = 'none';
                const doc = webWin.contentWindow.document;
                doc.open();
                // Complete sandboxed wrapper protecting master execution thread strings from runtime lockups
                doc.write(`<!DOCTYPE html><html><head><style>${data.css}</style></head><body>${data.html}<script>try{${data.js}}catch(e){document.body.innerHTML+='<div style="color:#ff0000; border:3px solid #000000; background:#ffffff; padding:15px; margin:20px; font-family:monospace; font-weight:bold; font-size:14px;"><strong>[Pasted JS Script Runtime Error]</strong><br>'+e.message+'</div>';}<\/script></body></html>`);
                doc.close();
            } 
            // 2. STATIC RICH TEXT TRANSLATION MODES
            else {
                webWin.style.display = 'none'; statWin.style.display = 'block';
                if (lang === 'md') {
                    statWin.innerHTML = marked.parse(data.md || '<em>No Markdown dataset loaded.</em>');
                }
                if (lang === 'txt') {
                    statWin.innerHTML = `<pre style="white-space:pre-wrap;">${cleanTextEntities(data.txt) || 'Plain text workspace is empty.'}</pre>`;
                }
                if (lang === 'csv') {
                    const lines = data.csv.trim().split('\n').filter(l => l.trim());
                    if (!lines.length) { statWin.innerHTML = '<em>CSV dataset field empty.</em>'; return; }
                    statWin.innerHTML = '<table>' + lines.map((l, i) => `<tr>${l.split(',').map(c => i === 0 ? `<th>${cleanTextEntities(c.trim())}</th>` : `<td>${cleanTextEntities(c.trim())}</td>`).join('')}</tr>`).join('') + '</table>';
                }
            }
        }

        function cleanTextEntities(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Action Utilities Management Engine Block
        function wipeWorkspace() { 
            if (confirm("Are you absolutely sure you want to completely clear out all editor tabs?")) { 
                data = { html:'', css:'', js:'', md:'', txt:'', csv:'' }; 
                box.value = ''; 
                localStorage.removeItem('stark_ws'); 
                setLang('html'); 
                setView('edit'); 
            } 
        }
        
        function exportWorkspace() { 
            const a = document.createElement('a'); 
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 4)); 
            a.download = `workspace_dump_${Math.floor(Date.now()/1000)}.json`; 
            a.click(); 
        }
        
        function importWorkspace(e) { 
            const r = new FileReader(); 
            r.onload = (evt) => { 
                try { 
                    data = JSON.parse(evt.target.result); 
                    box.value = data[lang] || ''; 
                    compile(); 
                    alert("All workspace tabs imported and ready!"); 
                } catch(ex) { 
                    alert("Corrupted configuration file blueprint context error."); 
                } 
            }; 
            r.readAsText(e.target.files[0]); 
            e.target.value = ''; 
        }

        // Live listening stream loops saving entries safely
        box.addEventListener('input', () => { 
            data[lang] = box.value; 
            localStorage.setItem('stark_ws', JSON.stringify(data)); 
        });
        
        window.onload = () => { 
            box.value = data.html; 
            box.style.display = 'block'; 
        };
    </script>
</body>
</html>
